name: ' Auto Release On Merge'

# Reacts to the CI/CD workflow completing on any branch, rather than to the PR-merge event
# itself. This guarantees a release is only ever created from a commit that CI/CD has actually
# built and tested successfully - reacting to "pull_request: closed" instead would race against
# the CI/CD run that starts asynchronously right after the merge, and nothing prevents a merge
# from happening before/without a successful CI/CD run in the first place (no required status
# check is enforced by branch protection here). See DEPLOYMENT-SCHEDULING.md for the incident
# this fixes, the branch-protection recommendation, and other known limitations.
on:
  workflow_run:
    workflows: [ 'CI/CD' ]
    types: [ completed ]

permissions:
  actions: read
  contents: read

jobs:
  CheckAndTriggerRelease:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Read settings
        id: ReadSettings
        uses: microsoft/AL-Go-Actions/ReadSettings@v9.2
        with:
          shell: powershell

      - name: Check settings and trigger release if enabled
        env:
          GH_TOKEN: ${{ github.token }}
          BaseRef: ${{ github.event.workflow_run.head_branch }}
        run: |
          $errorActionPreference = "Stop"; $ProgressPreference = "SilentlyContinue"; Set-StrictMode -Version 2.0

          $settings = $env:Settings | ConvertFrom-Json
          $auto = $settings.autoReleaseOnMerge

          if (-not $auto -or -not $auto.enabled) {
              Write-Host "autoReleaseOnMerge is not enabled (or not configured), nothing to do."
              exit 0
          }

          $branches = @($auto.branches)
          if ($branches -notcontains $env:BaseRef) {
              Write-Host "CI/CD succeeded on '$($env:BaseRef)', which is not in autoReleaseOnMerge.branches ($($branches -join ', ')). Nothing to do."
              exit 0
          }

          # Derive the release tag from the main app's version in app.json.
          # Heuristic: first app.json found, excluding folders that look like test/performance apps.
          # If your repo layout doesn't match this assumption, adjust this section.
          $appJsonFile = Get-ChildItem -Path . -Recurse -Filter "app.json" -File |
              Where-Object { $_.FullName -notmatch '\.(Test|PerformanceTest)\\' -and $_.FullName -notmatch '\\\.(altemplates|dependencies|alpackages)\\' } |
              Select-Object -First 1

          if (-not $appJsonFile) {
              throw "Could not find a main app.json to derive the release tag from. Adjust the heuristic in this workflow for your repo layout."
          }

          $appJson = Get-Content $appJsonFile.FullName -Raw | ConvertFrom-Json
          $version = [System.Version]$appJson.version
          $tag = "$($version.Major).$($version.Minor).0"
          Write-Host "Derived tag '$tag' from $($appJsonFile.FullName)"

          $workflowFile = if ($auto.workflowType -eq 'ReleaseWithDeploy') { 'CreateReleaseWithDeploy.yaml' } else { 'CreateRelease.yaml' }

          Write-Host "Triggering workflow '$workflowFile' on branch '$($env:BaseRef)' with tag '$tag'"
          gh workflow run $workflowFile `
              --ref $env:BaseRef `
              -f buildVersion=latest `
              -f name="Release $tag" `
              -f tag=$tag `
              -f releaseType=Release

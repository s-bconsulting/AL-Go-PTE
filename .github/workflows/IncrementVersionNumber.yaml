name: ' Increment Version Number'

run-name: "Increment Version Number in [${{ github.ref_name }}]"

on:
  workflow_dispatch:
    inputs:
      projects:
        description: Comma-separated list of project name patterns if the repository is setup for multiple projects (default is * for all projects)
        required: false
        default: '*'
      versionNumber:
        description: New Version Number in main branch. Use Major.Minor (optionally add .Build for versioningstrategy 3) for absolute change, or +1, +0.1 (or +0.0.1 for versioningstrategy 3) incremental change.
        required: false
        default: ''
      skipUpdatingDependencies:
        description: Skip updating dependency version numbers in all apps.
        type: boolean
        default: false
      directCommit:
        description: Direct Commit?
        type: boolean
        default: false
      useGhTokenWorkflow:
        description: Use GhTokenWorkflow for PR/Commit?
        type: boolean
        default: false

defaults:
  run:
    shell: powershell

env:
  ALGoOrgSettings: ${{ vars.ALGoOrgSettings }}
  ALGoRepoSettings: ${{ vars.ALGoRepoSettings }}

permissions:
  contents: read

jobs:
  IncrementVersionNumber:
    needs: [ ]
    runs-on: [ windows-latest ]
    permissions:
      actions: read
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - name: Dump Workflow Information
        uses: microsoft/AL-Go-Actions/DumpWorkflowInfo@v9.2
        with:
          shell: powershell

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize the workflow
        id: init
        uses: microsoft/AL-Go-Actions/WorkflowInitialize@v9.2
        with:
          shell: powershell

      - name: Read settings
        uses: microsoft/AL-Go-Actions/ReadSettings@v9.2
        with:
          shell: powershell

      - name: Validate Workflow Input
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: microsoft/AL-Go-Actions/ValidateWorkflowInput@v9.2
        with:
          shell: powershell

      - name: Read secrets
        id: ReadSecrets
        uses: microsoft/AL-Go-Actions/ReadSecrets@v9.2
        with:
          shell: powershell
          gitHubSecrets: ${{ toJson(secrets) }}
          getSecrets: 'TokenForPush'
          useGhTokenWorkflowForPush: '${{ github.event.inputs.useGhTokenWorkflow }}'

      - name: Capture BC version segment
        run: |
          $errorActionPreference = "Stop"; $ProgressPreference = "SilentlyContinue"; Set-StrictMode -Version 2.0

          # AL-Go-Actions/IncrementVersionNumber always resets app.json's 4th segment
          # (Revision) to 0 on every increment - confirmed from its source
          # (Set-VersionInSettingsFile: "# Always set the revision number to 0", no
          # condition on increment type). SB Consulting uses that segment as a manually-set
          # BC-compatibility marker that must survive ordinary increments untouched, so when
          # "versionBCPreserve" is enabled, capture every app.json's current Revision here,
          # before the increment runs, to restore it afterwards. Independent of
          # versioningStrategy - that setting only controls which increment syntaxes AL-Go's
          # own action allows, not this repo-specific behavior.
          $settings = $env:Settings | ConvertFrom-Json
          $preserve = $settings | Select-Object -ErrorAction SilentlyContinue -ExpandProperty versionBCPreserve
          $captureFile = Join-Path $env:RUNNER_TEMP "bcVersionSegments.json"

          if (-not $preserve) {
              Write-Host "versionBCPreserve is not enabled, nothing to capture."
              "{}" | Set-Content -Path $captureFile
              exit 0
          }

          $appJsonFiles = Get-ChildItem -Path . -Recurse -Filter "app.json" -File |
              Where-Object { $_.FullName -notmatch '\\\.(altemplates|dependencies|alpackages)\\' }

          $map = @{}
          foreach ($file in $appJsonFiles) {
              $appJson = Get-Content $file.FullName -Raw | ConvertFrom-Json
              try {
                  $version = [System.Version]$appJson.version
                  $map[$file.FullName] = $version.Revision
              } catch {
                  Write-Host "Skipping $($file.FullName) - version '$($appJson.version)' is not a valid version string."
              }
          }
          $map | ConvertTo-Json | Set-Content -Path $captureFile
          Write-Host "Captured BC version segment for $($map.Count) app.json file(s)."

      - name: Increment Version Number
        uses: microsoft/AL-Go-Actions/IncrementVersionNumber@v9.2
        with:
          shell: powershell
          token: ${{ steps.ReadSecrets.outputs.TokenForPush }}
          projects: ${{ github.event.inputs.projects }}
          versionNumber: ${{ github.event.inputs.versionNumber }}
          skipUpdatingDependencies: ${{ github.event.inputs.skipUpdatingDependencies }}
          directCommit: ${{ github.event.inputs.directCommit }}

      - name: Restore BC version segment
        if: ${{ github.event.inputs.directCommit == 'true' }}
        run: |
          $errorActionPreference = "Stop"; $ProgressPreference = "SilentlyContinue"; Set-StrictMode -Version 2.0

          $settings = $env:Settings | ConvertFrom-Json
          $preserve = $settings | Select-Object -ErrorAction SilentlyContinue -ExpandProperty versionBCPreserve
          if (-not $preserve) {
              Write-Host "versionBCPreserve is not enabled, nothing to restore."
              exit 0
          }

          $captureFile = Join-Path $env:RUNNER_TEMP "bcVersionSegments.json"
          $map = Get-Content $captureFile -Raw | ConvertFrom-Json

          # Pick up the commit the increment step just pushed with directCommit: true.
          git fetch origin
          git reset --hard "origin/$($env:GITHUB_REF_NAME)"

          $changed = $false
          foreach ($property in $map.PSObject.Properties) {
              $path = $property.Name
              $originalRevision = $property.Value
              if (-not (Test-Path $path)) {
                  continue
              }
              $appJson = Get-Content $path -Raw | ConvertFrom-Json
              $version = [System.Version]$appJson.version
              if ($version.Revision -ne $originalRevision) {
                  $newVersion = "$($version.Major).$($version.Minor).$($version.Build).$originalRevision"
                  Write-Host "Restoring BC version segment in $path : $($appJson.version) -> $newVersion"
                  $appJson.version = $newVersion
                  $appJson | ConvertTo-Json -Depth 20 | Set-Content -Path $path -Encoding UTF8
                  $changed = $true
              }
          }

          if ($changed) {
              # Always the default GITHUB_TOKEN, never the ghTokenWorkflow PAT - a push made
              # with GITHUB_TOKEN never triggers "on: push" workflows (confirmed on this repo),
              # so this correction commit stays invisible to CI/CD and everything downstream
              # of it, regardless of what useGhTokenWorkflow was passed for the increment itself.
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add -A
              git commit -m "Restore BC version segment after increment"
              git push origin "HEAD:$($env:GITHUB_REF_NAME)"
          } else {
              Write-Host "Nothing to restore - no app.json's BC version segment changed."
          }

      - name: Finalize the workflow
        if: always()
        uses: microsoft/AL-Go-Actions/WorkflowPostProcess@v9.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          shell: powershell
          telemetryScopeJson: ${{ steps.init.outputs.telemetryScopeJson }}
          currentJobContext: ${{ toJson(job) }}

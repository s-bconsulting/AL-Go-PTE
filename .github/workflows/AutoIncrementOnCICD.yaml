name: ' Auto Increment On CICD'

# Reacts to CI/CD succeeding, to keep the development branch's version moving forward
# automatically as work lands on it - independent of AutoReleaseOnMerge.yaml, which only bumps
# the dev branch once, right after a release is cut from main. See docs/DEPLOYMENT-SCHEDULING.md.
#
# Deliberately NOT scoped by a static "on: push: branches:" filter here - CI/CD itself already
# does that scoping (CICD.yaml's own branches list), and this workflow only needs to react to
# CI/CD completing, on whichever branch that happened to be. The enabled/branch check (against
# the "autoIncrementOnCICD" setting) happens inside the job.
on:
  workflow_run:
    workflows: [ 'CI/CD' ]
    types: [ completed ]

# Confirmed on a real run (16/09/2026): GitHub delivered the SAME CI/CD completion 3 times about
# 18 minutes apart (likely tied to self-hosted runner queue latency), firing this workflow 3
# times for one underlying event and tripling the version increment. All 3 evaluated the branch
# state before any of them had pushed a commit, so a same-branch concurrency group is needed to
# serialize them (queued, not cancelled - a duplicate must still be skipped cleanly, not just
# dropped) rather than letting them race in parallel.
concurrency:
  group: auto-increment-on-cicd-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  # actions: write is required by "gh workflow run" (creating a workflow_dispatch event) -
  # confirmed via a real 403 "Resource not accessible by integration" with actions: read alone.
  actions: write
  contents: read

jobs:
  CheckAndTriggerIncrement:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Read settings
        id: ReadSettings
        uses: microsoft/AL-Go-Actions/ReadSettings@v9.2
        with:
          shell: powershell

      - name: Check settings and trigger increment if enabled
        env:
          GH_TOKEN: ${{ github.token }}
          HeadBranch: ${{ github.event.workflow_run.head_branch }}
          TriggerHeadSha: ${{ github.event.workflow_run.head_sha }}
          Repository: ${{ github.repository }}
          # workflow_run's head_commit.message is the exact commit message of the run's HEAD.
          # AL-Go-Actions/IncrementVersionNumber always commits as either
          # "Incremented Version number by <value>" (incremental) or "New Version number <value>"
          # (absolute) - confirmed from its source (IncrementVersionNumber.ps1, v9.2). Matching on
          # this is how the loop below is broken, since neither AL-Go nor this workflow otherwise
          # marks that commit as [skip ci] before pushing it.
          CommitMessage: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          $errorActionPreference = "Stop"; $ProgressPreference = "SilentlyContinue"; Set-StrictMode -Version 2.0

          $settings = $env:Settings | ConvertFrom-Json
          # Use Select-Object -ExpandProperty (not dot notation) - autoIncrementOnCICD is a custom
          # setting AL-Go itself knows nothing about, so branches/settings.json files that don't
          # define it at all won't have the property present. Under Set-StrictMode -Version 2.0,
          # referencing a genuinely absent property via dot notation throws; -ErrorAction
          # SilentlyContinue here just yields $null instead, treated as "not configured" below.
          $auto = $settings | Select-Object -ErrorAction SilentlyContinue -ExpandProperty autoIncrementOnCICD

          if (-not $auto -or -not $auto.enabled) {
              Write-Host "autoIncrementOnCICD is not enabled (or not configured), nothing to do."
              exit 0
          }

          $branches = @($auto.branches)
          if ($branches -notcontains $env:HeadBranch) {
              Write-Host "CI/CD succeeded on '$($env:HeadBranch)', which is not in autoIncrementOnCICD.branches ($($branches -join ', ')). Nothing to do."
              exit 0
          }

          # Loop guard: this CI/CD run's own head commit might be the increment commit from a
          # PREVIOUS run of this same workflow - if so, incrementing again would trigger CI/CD
          # again, which would trigger another increment, forever. Skip in that case.
          if ($env:CommitMessage -match '^(Incremented Version number by |New Version number )') {
              Write-Host "Head commit ('$($env:CommitMessage)') is itself a version-increment commit - skipping to avoid an increment loop."
              exit 0
          }

          # Duplicate-delivery guard: confirmed on a real run that GitHub can fire this workflow
          # multiple times for the SAME CI/CD completion (3x here, ~18 min apart). The
          # concurrency group above serializes these, but only the *dispatch-and-wait* below
          # actually makes that useful - if a queued duplicate's branch no longer matches the
          # commit it originally reacted to, an earlier duplicate already handled it.
          $currentSha = gh api "repos/$($env:Repository)/branches/$($env:HeadBranch)" --jq '.commit.sha'
          if ($currentSha -ne $env:TriggerHeadSha) {
              Write-Host "Branch '$($env:HeadBranch)' HEAD ($currentSha) no longer matches the commit this run reacted to ($($env:TriggerHeadSha)) - a duplicate delivery of this same CI/CD success already handled it. Skipping."
              exit 0
          }

          $versionIncrement = if ($auto.versionIncrement) { $auto.versionIncrement } else { '+0.0.1' }

          Write-Host "Incrementing version by '$versionIncrement' on '$($env:HeadBranch)'"
          gh workflow run IncrementVersionNumber.yaml `
              --ref $env:HeadBranch `
              -f versionNumber=$versionIncrement `
              -f directCommit=true

          # Wait for it to finish before this job ends. Combined with the concurrency group
          # above, this is what makes the duplicate-delivery guard effective: a queued duplicate
          # only starts checking branch state after this one's dispatched run (and its own "Fix
          # BC version marker" commit) has actually landed, so it correctly sees the branch has
          # moved and skips, instead of racing to dispatch its own duplicate increment.
          $timeoutMinutes = 20
          $pollSeconds = 15
          $deadline = (Get-Date).AddMinutes($timeoutMinutes)
          $dispatchedAt = Get-Date
          $run = $null
          while ((Get-Date) -lt $deadline) {
              Start-Sleep -Seconds $pollSeconds
              $runs = gh run list --workflow "IncrementVersionNumber.yaml" --branch $env:HeadBranch --json databaseId,status,createdAt --limit 10 | ConvertFrom-Json
              $run = $runs | Where-Object { [DateTime]$_.createdAt -ge $dispatchedAt.AddSeconds(-10) } | Sort-Object createdAt | Select-Object -First 1
              if ($run -and $run.status -eq 'completed') {
                  break
              }
          }
          if ($run -and $run.status -eq 'completed') {
              Write-Host "IncrementVersionNumber run $($run.databaseId) completed."
          } else {
              Write-Host "::warning::Timed out waiting for the dispatched IncrementVersionNumber run to complete - a duplicate delivery arriving after this point may not be caught by the guard above."
          }
